<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pineapple Time Generator</title>
  <link href="https://fonts.cdnfonts.com/css/some-time-later" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1 class="app-title">Pineapple Time Generator</h1>
  </header>

  <main>

    <!-- Card preview -->
    <div id="cardContainer">
      <div id="timeCard">
        <!-- .text-wrapper injected by render() -->
      </div>
      <div id="downloadOverlay" class="download-overlay" hidden>
        <div class="spinner"></div>
        <span>Generating...</span>
      </div>
    </div>

    <p class="card-hint">Drag to reposition text</p>

    <!-- Background strip -->
    <div id="bgStrip">
      <!-- thumbnails injected by renderStrip() -->
      <input type="file" id="bgUploadInput" accept="image/*" hidden>
      <button id="btnBgUpload" class="btn-bg-upload" aria-label="Upload background">+</button>
    </div>

    <!-- Text row -->
    <div id="textRow">
      <textarea id="textInput" rows="1" placeholder="Type your text..."></textarea>
      <button id="btnRandom" title="Random phrase">Phrase ↺</button>
      <button id="btnRandomBg" title="Random background">Background ↺</button>
      <button id="btnRandomColors" class="btn-random-colors" title="Random colors">Colors ↺</button>
      <button id="btnDownload" title="Download PNG">Download ↓</button>
    </div>

    <!-- Advanced panel -->
    <div id="advancedSection">
      <button id="btnToggleAdvanced" class="btn-toggle-advanced">▼ Customize</button>
      <div id="advancedPanel" hidden>

        <div class="panel-section" id="sectionColors">
          <span class="panel-label">Colors</span>
          <label class="color-label">Text <input type="color" id="colorText" value="#5c2e0d"></label>
          <label class="color-label">Shadow <input type="color" id="colorShadow" value="#ffe566"></label>
        </div>

        <div class="panel-section" id="sectionSize">
          <span class="panel-label">Text size</span>
          <button id="btnFontMinus" class="btn-font-step">−</button>
          <span id="fontSizeDisplay">3.0em</span>
          <button id="btnFontPlus"  class="btn-font-step">+</button>
          <input type="range" id="sliderFontSize" min="0.5" max="8" step="0.1" value="3">
        </div>

        <div class="panel-section" id="sectionPosition">
          <span class="panel-label">Align</span>
          <div class="align-buttons">
            <button id="btnAlignLeft"   class="btn-align" data-align="left">L</button>
            <button id="btnAlignCenter" class="btn-align" data-align="center">C</button>
            <button id="btnAlignRight"  class="btn-align" data-align="right">R</button>
          </div>
          <button id="btnResetPosition" class="btn-reset">Reset</button>
        </div>

        <div class="panel-section" id="sectionRatio">
          <span class="panel-label">Format</span>
          <button id="btnRatio" class="btn-ratio">16:9 → 4:3</button>
        </div>

        <div class="panel-section" id="favoritesSection">
          <span class="panel-label">Favorites</span>
          <div class="fav-save-row">
            <input type="text" id="favNameInput" placeholder="Favorite name">
            <button id="btnSaveFavorite" class="btn-save-fav">Save</button>
          </div>
          <span id="favNameError" class="fav-error" hidden>Enter a name</span>
          <div id="favoritesList"></div>
          <div class="fav-io-row">
            <button id="btnExportFavorites" class="btn-export-fav">Export JSON</button>
            <button id="btnImportFavorites" class="btn-import-fav">Import JSON</button>
            <input type="file" id="importFileInput" accept=".json" hidden>
          </div>
        </div>

      </div><!-- /advancedPanel -->
    </div><!-- /advancedSection -->

  </main>

  <!-- Import modal -->
  <div id="importModal" hidden>
    <div class="modal-overlay" id="importOverlay"></div>
    <div class="modal-box">
      <h2>Import favorites</h2>
      <p id="importSummary"></p>
      <div class="modal-buttons">
        <button id="btnImportMerge"   class="btn-merge">Merge</button>
        <button id="btnImportReplace" class="btn-replace">Replace</button>
        <button id="btnImportCancel"  class="btn-cancel-modal">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toastContainer"></div>

  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
