<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pineapple Time Generator</title>
  <meta name="description" content="Make SpongeBob-style time cards and export them as clean PNGs for video editing.">
  <meta name="theme-color" content="#06080e">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Pineapple Time Generator">
  <meta property="og:description" content="Make SpongeBob-style time cards and export them as clean PNGs for video editing.">
  <meta property="og:url" content="https://memoriainfinita.github.io/PineappleTimeGenerator/">
  <meta property="og:image" content="https://memoriainfinita.github.io/PineappleTimeGenerator/docs/PineappleTimeGenerator-demo.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin>
  <link href="https://fonts.cdnfonts.com/css/some-time-later" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1 class="app-title">Pineapple Time Generator</h1>
  </header>

  <main>

    <!-- Card preview -->
    <div id="cardContainer">
      <div id="timeCard" tabindex="0" role="group"
           title="Drag to move the text. With the card focused, the arrow keys move it (Shift for bigger steps)."
           aria-label="Time card. Drag the text or use the arrow keys to move it; Shift moves it further.">
        <!-- .text-wrapper injected by render() -->
      </div>
      <div id="downloadOverlay" class="download-overlay" hidden>
        <div class="spinner"></div>
        <span>Generating...</span>
      </div>
    </div>

    <!-- Background strip -->
    <div id="bgStrip">
      <button id="btnBgUpload" class="btn-bg-upload" aria-label="Upload background"
              title="Upload your own background (the last 5 are kept)">+</button>
      <input type="file" id="bgUploadInput" accept="image/*" aria-label="Background image" hidden>
      <div id="bgScroll"><!-- thumbnails injected by renderStrip() --></div>
    </div>

    <!-- Text row -->
    <div id="textRow">
      <textarea id="textInput" rows="1" placeholder="Type your text..." aria-label="Card text"
                title="Card text. Enter adds a new line."></textarea>
      <button id="btnRandom" title="Pick a random phrase">Phrase ↺</button>
      <button id="btnRandomBg" title="Pick a random background">Background ↺</button>
      <button id="btnRandomColors" title="Pick text and shadow colors that read well over the part of the background behind the text">Colors ↺</button>
      <button id="btnDownload" title="Download PNG">Download ↓</button>
    </div>

    <!-- Advanced panel -->
    <div id="advancedSection">
      <button id="btnToggleAdvanced" class="btn-toggle-advanced" aria-expanded="false" aria-controls="advancedPanel"
              title="Show or hide the customize panel (Esc closes it)">▼ Customize</button>
      <div id="advancedPanel" hidden>

        <div class="panel-section" id="sectionColors">
          <span class="panel-label">Colors</span>
          <label class="color-label" title="Text color">Text <input type="color" id="colorText" value="#5c2e0d"></label>
          <label class="color-label" title="Shadow color, also used for the outline">Shadow <input type="color" id="colorShadow" value="#ffe566"></label>
          <div class="seg-group" role="group" aria-label="Text effect">
            <button class="btn-seg" data-effect="shadow" title="Offset shadow behind the text">Shadow</button>
            <button class="btn-seg" data-effect="outline" title="Outline around the text">Outline</button>
          </div>
        </div>

        <div class="panel-section" id="sectionSize">
          <span class="panel-label">Text size</span>
          <button id="btnFontMinus" class="btn-font-step" aria-label="Smaller text" title="Smaller text">−</button>
          <span id="fontSizeDisplay">3.0em</span>
          <button id="btnFontPlus"  class="btn-font-step" aria-label="Larger text" title="Larger text">+</button>
          <input type="range" id="sliderFontSize" min="0.5" max="8" step="0.1" value="3" aria-label="Text size" title="Text size">
        </div>

        <div class="panel-section" id="sectionPosition">
          <span class="panel-label">Align</span>
          <div class="seg-group" role="group" aria-label="Text alignment">
            <button class="btn-seg" data-align="left"   aria-label="Align left"   title="Align left (shows on several lines)">L</button>
            <button class="btn-seg" data-align="center" aria-label="Align center" title="Align center (shows on several lines)">C</button>
            <button class="btn-seg" data-align="right"  aria-label="Align right"  title="Align right (shows on several lines)">R</button>
          </div>
          <button id="btnResetPosition" class="btn-reset" title="Move the text back to the center">Reset</button>
        </div>

        <div class="panel-section" id="sectionRatio">
          <span class="panel-label">Format</span>
          <div class="seg-group" role="group" aria-label="Aspect ratio">
            <button class="btn-seg" data-ratio="16:9">16:9</button>
            <button class="btn-seg" data-ratio="4:3">4:3</button>
            <button class="btn-seg" data-ratio="9:16">9:16</button>
            <button class="btn-seg" data-ratio="1:1">1:1</button>
          </div>
          <label class="check-label" title="Export only the text on a transparent background, to lay over a clip in your editor"><input type="checkbox" id="chkTransparent"> Transparent PNG</label>
        </div>

        <div class="panel-section" id="favoritesSection">
          <span class="panel-label">Favorites</span>
          <div class="fav-save-row">
            <input type="text" id="favNameInput" placeholder="Favorite name" maxlength="80" aria-label="Favorite name"
                   title="Name for this favorite">
            <button id="btnSaveFavorite" class="btn-save-fav" title="Save the current card as a favorite (Ctrl+S)">Save</button>
          </div>
          <span id="favNameError" class="fav-error" role="alert" hidden>Enter a name</span>
          <div id="favoritesList"></div>
          <div class="fav-io-row">
            <button id="btnExportFavorites" class="btn-export-fav" title="Download your favorites as a JSON file">Export JSON</button>
            <button id="btnImportFavorites" class="btn-import-fav" title="Load favorites from a JSON file">Import JSON</button>
            <input type="file" id="importFileInput" accept=".json" aria-label="Favorites file" hidden>
          </div>
        </div>

      </div><!-- /advancedPanel -->
    </div><!-- /advancedSection -->

  </main>

  <!-- Import modal -->
  <div id="importModal" role="dialog" aria-modal="true" aria-labelledby="importTitle" hidden>
    <div class="modal-overlay" id="importOverlay"></div>
    <div class="modal-box">
      <h2 id="importTitle">Import favorites</h2>
      <p id="importSummary"></p>
      <div class="modal-buttons">
        <button id="btnImportMerge"   class="btn-merge"   title="Add the imported favorites to yours; ones you already have are skipped">Merge</button>
        <button id="btnImportReplace" class="btn-replace" title="Replace all your favorites with the imported ones">Replace</button>
        <button id="btnImportCancel"  class="btn-cancel-modal" title="Close without importing (Esc)">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toastContainer" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
